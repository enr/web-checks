name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: static (Tier 0)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: sudo apt-get install -y shellcheck
      # Install, lint, unit tests, package + smoke test of the tarball. No Chromium
      # here: the browser tests are skipped and run in the job below.
      - run: .sdlc/ci

  browser:
    name: browser (Tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: .sdlc/test e2e
        env:
          WEB_CHECKS_CI_STRICT: '1'

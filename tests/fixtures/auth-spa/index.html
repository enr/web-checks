<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auth SPA</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const token = localStorage.getItem('token');
      const app = document.getElementById('app');
      if (token) {
        app.innerHTML = '<div data-testid="app-shell"><h1>Dashboard</h1></div>';
      } else {
        app.innerHTML = '<form id="login"><input id="email" /><button type="submit">Login</button></form>';
      }
    </script>
  </body>
</html>
